name: Release

# Tag a commit to cut a release:
#   npm run set-version 0.1.2
#   git commit -am "Release 0.1.2" && git tag v0.1.2 && git push --follow-tags
# Or run it by hand from the Actions tab to test the pipeline without tagging.
on:
  push:
    tags: ["v*"]
  # A manual run builds and uploads the installer as a workflow artifact
  # without publishing anything - use it to test the pipeline before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows (x64)

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      # A tag that disagrees with the manifests ships an installer labelled
      # with the wrong version. Fail here rather than after a 10-minute build.
      - name: Check the tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          for name in conf pkg cargo; do
            value="${!name}"
            if [ "$value" != "$tag" ]; then
              echo "::error::$name is $value but the tag is $tag - bump it before tagging"
              exit 1
            fi
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on Cargo.lock so a dependency bump busts it, not every commit.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Test frontend
        run: npm test

      - name: Test backend
        working-directory: src-tauri
        run: cargo test

      # The catalog is a build artifact, not a committed file. Generating it
      # here is what lets the installer ship a ready-to-search app: without
      # this step the build succeeds but every user gets an empty search box.
      - name: Generate item catalog
        run: npm run sync-catalog

      - name: Verify the catalog is real
        shell: bash
        run: |
          db="src-tauri/resources/items.db"
          size=$(wc -c < "$db")
          echo "items.db is $size bytes"
          # A placeholder is 0 bytes and a truncated sync is far under a MB.
          if [ "$size" -lt 3000000 ]; then
            echo "::error::items.db looks truncated ($size bytes) - refusing to ship an empty catalog"
            exit 1
          fi

      # The updater refuses an unsigned payload, so the private key has to be
      # present here or the build emits an installer no existing user can
      # install. Both come from repository secrets; the password is an empty
      # string for an unprotected key, which is still a secret in transit.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # The `.sig` rides along with the installer: the publish job needs it to
      # write the manifest, and without it every installed copy would be stuck
      # on its current version with no error to see.
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish:
    # Only tags publish. A manual run just leaves the installer as an artifact
    # you can download and try.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Tauri signs the installer but does not write the manifest the updater
      # polls - that part is the caller's job, so it is assembled here from the
      # signature and the tag.
      - name: Write the updater manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          exe=$(basename artifacts/*-setup.exe)
          if [ ! -f "artifacts/${exe}.sig" ]; then
            echo "::error::no signature beside ${exe} - was TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi
          cat > artifacts/latest.json <<JSON
          {
            "version": "${version}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat "artifacts/${exe}.sig")",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${exe}"
              }
            }
          }
          JSON
          cat artifacts/latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*-setup.exe
            artifacts/latest.json
          name: FFXIV Market Overlay ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body: |
            ## Install

            Download the `.exe` below and run it. It installs for your user
            account only, so there is no admin prompt.

            Windows will likely show **"Windows protected your PC"** because
            this installer is not code-signed. Click **More info**, then
            **Run anyway**. This is normal for community FFXIV tools.

            The item catalog ships inside the installer, so search works the
            moment the app opens. Prices default to your region, guessed from
            your system time zone - open settings to narrow it to your home
            world.
